variant: fcos
version: 1.5.0

###
## Default configuration for cloud environments
###
storage:
  ## Keep selinux re-labeling from failing on these missing paths
  directories:
    - path: /etc/systemd/system-preset
  files:
    - path: /etc/systemd/system-preset/20-ignition.preset

passwd:
  users:
    ## Remove the default cloud user
    - name: core
      should_exist: false

    - name: jmanero
      groups:
        - sudo
      ssh_authorized_keys:
        - "sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAILnOoNh713fD8y4WCSQ1xenme81YSkZoBk2rSD+xFBe0AAAABHNzaDo= jmanero@oakwood+yk_19285130"
